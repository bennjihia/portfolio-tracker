name: Update prices

on:
  schedule:
    # Every 30 min, 09:00-15:30 EAT (06:00-12:30 UTC), Mon-Fri
    - cron: "*/30 6-12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch prices
        run: python3 fetch_prices.py
      - name: Commit if changed
        run: |
          git config user.name "afrivest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "Update prices" && git push)
